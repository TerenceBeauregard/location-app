version: '3.8'

services:
  # Base Infrastructure
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rental-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # Databases
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./auth-service/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: user_db
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./user-service/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  listing-db:
    image: postgres:16-alpine
    container_name: listing-db
    environment:
      POSTGRES_USER: listing_user
      POSTGRES_PASSWORD: ${LISTING_DB_PASSWORD}
      POSTGRES_DB: listing_db
    volumes:
      - listing_db_data:/var/lib/postgresql/data
      - ./listing-service/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listing_user -d listing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
      POSTGRES_DB: booking_db
    volumes:
      - booking_db_data:/var/lib/postgresql/data
      - ./booking-service/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:16-alpine
    container_name: notification-db
    environment:
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: notification_db
    volumes:
      - notification_db_data:/var/lib/postgresql/data
      - ./notification-service/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rental-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core Services
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Microservices
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-mysecretkeythatisverylongandsecureandneededbyjwt}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  listing-service:
    build: ./listing-service
    container_name: listing-service
    environment:
      LISTING_DB_PASSWORD: ${LISTING_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      listing-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  booking-service:
    build: ./booking-service
    container_name: booking-service
    environment:
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Frontend
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - rental-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  rental-network:
    driver: bridge

volumes:
  auth_db_data:
  user_db_data:
  listing_db_data:
  booking_db_data:
  notification_db_data:
